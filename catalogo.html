<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - EcoMarket</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar shadow-sm sticky-top custom-navbar">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand d-flex align-items-center gap-2 text-decoration-none" href="#">
                <div class="logo-icon bg-success text-white rounded-3 d-flex align-items-center justify-content-center fw-bold shadow-sm">
                    🌱
                </div>
                <span class="fw-bold fs-4 logo-text">EcoMarket</span>
            </a>
       <ul class="nav align-items-center gap-4 mb-0 list-unstyled">
                <li class="nav-item"><a class="nav-link fw-semibold p-0 nav-link-custom" href="EcoMarket.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link fw-semibold p-0 nav-link-custom" href="catalogo.html">Catálogo</a></li>
                <li class="nav-item"><a class="nav-link fw-semibold p-0 nav-link-custom" href="EcoMarket.html#contacto">Contacto</a></li>
                <li class="nav-item"><button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#carritoModal"> 🛒 Carrito (<span id="contador-carrito">0</span>)</button></li>
                <li class="nav-item"><a href="catalogo.html" class="btn btn-success text-white px-3 py-2 fw-semibold shadow-sm">Ver Productos</a></li>
            </ul>
        </div>
    </nav>

        <section id="catalogo" class="py-5" aria-labelledby="titulo-catalogo">
        <div class="container">
            <h2 id="titulo-catalogo" class="fw-bold mb-4">Catálogo</h2>
            <div class="row g-3 mb-4">
                <div class="col-md-8">
                    <label for="buscador" class="form-label">Buscar producto</label>
                    <input type="search" id="buscador" class="form-control" placeholder="Ej: bolsa, cepillo...">
                </div>
                <div class="col-md-4">
                    <label for="filtro" class="form-label">Categoría</label>
                    <select id="filtro" class="form-select">
                        <option value="todas">Todas</option>
                        <option value="Hogar">Hogar</option>
                        <option value="Cuidado personal">Cuidado personal</option>
                    </select>
                </div>
            </div>
            <div id="productos" class="row g-4" aria-live="polite"></div>
            <p id="sin-resultados" class="text-center d-none">No se encontraron productos.</p>
        </div>
    </section>

<p id="sin-resultados" class="text-center d-none">No se encontraron productos.</p>
<!-- Modal del Carrito de Compras -->
<div class="modal fade" id="carritoModal" tabindex="-1" aria-labelledby="carritoModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="carritoModalLabel">Tu Lista de Compras Ecológicas</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <ul id="lista-carrito" class="list-group mb-3">
          <!-- Los productos se inyectarán aquí -->
        </ul>
        <div class="d-flex justify-content-between fw-bold fs-5">
            <span>Total:</span>
            <span id="total-carrito">$0.00</span>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Seguir Comprando</button>
        <button type="button" class="btn btn-primary" id="btn-finalizar-compra">Finalizar Compra</button>
      </div>
    </div>
  </div>
</div>

    <p id="sin-resultados" class="text-center d-none">No se encontraron productos.</p>
    
<!-- Modal del Carrito de Compras -->
<div class="modal fade" id="carritoModal" tabindex="-1" aria-labelledby="carritoModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="carritoModalLabel">Tu Lista de Compras Ecológicas</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <ul id="lista-carrito" class="list-group mb-3">
          <!-- Los productos se inyectarán aquí desde  -->
        </ul>
        <div class="d-flex justify-content-between fw-bold fs-5">
            <span>Total:</span>
            <span id="total-carrito">$0.00</span>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Seguir Comprando</button>
        <button type="button" class="btn btn-primary" id="btn-finalizar-compra">Finalizar Compra</button>
      </div>
    </div>
  </div>
</div>

    <script src="script.js"></script>
    <script src="carrito.js"></script>
</body>
</html>
